# What every change to the docs must pass, and what runs each night against ai-operations-layer main:
#
#   build      the site builds; every internal link resolves (starlight-links-validator fails the
#              build); the search index, llms.txt, each page's Markdown copy, the changelog feed and
#              the API reference are in the output; no private names or paths are in it.
#   links      every external link in the built site answers.
#   privacy    the built site contacts no other host; the API reference's Test Request goes only to
#              the server it is given and keeps no token after a reload. Accessibility runs on the
#              same pages in the same browser.
#   openapi    the draft spec covers every route aiops-server declares, and declares none it
#              doesn't — checked both ways against crates/aiops-server/src/app.rs on main.
#   coverage   every code block on every page runs, is a checked output, or says why it can't (not-run).
#   snippets   aiops-server is built from the ai-operations-layer ref the docs pin — main on the
#              nightly and on pushes — and started against a real PostgreSQL with the quick start's
#              own commands; then every example on the pages runs, in order, and its output must
#              match what the page shows (ids, times and secrets normalised).
name: ci

on:
  push:
    branches: [main, 'docs/**'] # docs/** so a branch is checked before review
  pull_request:
  schedule:
    - cron: '41 5 * * *' # nightly: catch ai-operations-layer main moving under the docs
  workflow_dispatch:
    inputs:
      product-ref:
        description: 'ai-operations-layer ref the examples run against'
        default: main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (links, search, llms.txt, Markdown copies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Every code block runs, is a checked output, or says why it can't (not-run)
        run: node scripts/snippets.mjs --coverage
      - name: Build, validate internal links, check the output
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7

  links:
    name: external links
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https://docs\.ai-operations-layer\.404human\.dev'
            --exclude '^https://github\.com/akira-shirase-oss/ai-operations-layer-docs/(edit|issues/new)'
            --exclude '^https://aiops\.example\.com'
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true

  privacy:
    name: privacy (no third-party hosts; try-it goes only to the configured server; no token kept)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Serve the built site and check every request it makes
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          PREVIEW=http://127.0.0.1:4321 node scripts/check-privacy.mjs
          # Accessibility on the same build: the helper first proves it fails a known-bad fixture,
          # then every sitemap page passes.
          PREVIEW=http://127.0.0.1:4321 node scripts/axe-scan.check.mjs

  openapi:
    name: draft OpenAPI spec covers the server's routes, both ways
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out ai-operations-layer main for its route table
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akira-shirase-oss/ai-operations-layer
          path: ai-operations-layer
          persist-credentials: false
      - name: Every server route in the spec; no spec path the server lacks
        run: AIOPS_LAYER_DIR=ai-operations-layer node scripts/check-openapi.mjs

  snippets:
    name: examples run against ai-operations-layer main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops-dev
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The steps the pages run, in order
        run: node scripts/snippets.mjs --list
      # The product checkout must exist before rust-cache: the cache step runs `cargo metadata`
      # in the workspace below, and without a checkout it errors on a missing cwd and computes a
      # key over zero lockfiles — always cold. scripts/snippets.mjs still owns the ref: when
      # AIOPS_LAYER_REF is set it fetches and detaches that ref over whatever is here, so the
      # quick start's own install block finds a checkout and only builds, as it does for a
      # reader.
      - name: Check out ai-operations-layer where the suite and the cache look for it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: akira-shirase-oss/ai-operations-layer
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.product-ref || 'main' }}
          path: .snippets/work/ai-operations-layer
          persist-credentials: false
      - name: Install the pinned Rust toolchain the product asks for
        run: |
          rustup --version
          rustup toolchain install stable || rustup show
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .snippets/work/ai-operations-layer
      - name: Run every example against the real server
        env:
          AIOPS_LAYER_REF: ${{ github.event_name == 'schedule' && 'main' || inputs.product-ref || 'main' }}
          AIOPS_DB: postgres://aiops:aiops-dev@127.0.0.1:5432/aiops
        run: node scripts/snippets.mjs
      - name: The server's log, if anything failed
        if: failure()
        run: find .snippets/work -name '*.log' -o -name 'srv.log' | head -20 && tail -100 .snippets/work/ai-operations-layer/srv.log 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snippets
          path: .snippets/run/
          if-no-files-found: ignore
          retention-days: 7
